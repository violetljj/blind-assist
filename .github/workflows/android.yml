name: Android

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository hygiene
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/check_repo_hygiene.ps1

      - name: Smoke-test repository hygiene rules
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/test_repo_hygiene.ps1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Run tests, lint, and assemble APKs
        run: ./gradlew :core:assist:test :core:vision:testDebugUnitTest :core:device:testDebugUnitTest :core:ui:testDebugUnitTest :feature:assist:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :core:vision:lintDebug :core:device:lintDebug :core:ui:lintDebug :feature:assist:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :device-benchmark:assembleDebug

      - name: Set up Python for model checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TFLite inspection runtime
        run: python -m pip install --upgrade pip ai-edge-litert

      - name: Check TFLite model assets
        run: python scripts/inspect_tflite.py

      - name: Ensure generated files are ignored
        shell: pwsh
        run: |
          $status = git status --short
          if ($status) {
            Write-Host "Tracked or unignored files changed during CI:"
            Write-Host $status
            exit 1
          }
