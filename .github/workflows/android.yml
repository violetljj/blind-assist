name: Android

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository hygiene
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pwsh -ExecutionPolicy Bypass -File ./scripts/check_repo_hygiene.ps1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Run JVM tests
        run: ./gradlew :core:assist:test :core:vision:testDebugUnitTest :core:device:testDebugUnitTest :core:ui:testDebugUnitTest :feature:assist:testDebugUnitTest :app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew :app:lintDebug :core:vision:lintDebug :core:device:lintDebug :core:ui:lintDebug :feature:assist:lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Ensure generated files are ignored
        shell: pwsh
        run: |
          $status = git status --short
          if ($status) {
            Write-Host "Tracked or unignored files changed during CI:"
            Write-Host $status
            exit 1
          }
