name: Python tools

on:
  push:
    branches: [master]
    paths: ['tools/**', 'scripts/**', 'research/**', 'data/**', '.gitattributes', '.github/workflows/python-tools.yml']
  pull_request:
    paths: ['tools/**', 'scripts/**', 'research/**', 'data/**', '.gitattributes', '.github/workflows/python-tools.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # Tiny deterministic unit fixtures: TASK_NOT_GPU_SUITABLE. No models/data downloads.
      - name: Install unit-test dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.1.3 pillow==11.1.0 OpenEXR==3.3.3
      - name: Verify research checkout byte identity
        run: python tools/check_research_checkout_bytes.py
      - name: Prepare isolated test scratch
        run: python -c "from pathlib import Path; Path('artifacts.local/tmp').mkdir(parents=True, exist_ok=True)"
      - name: Test research tools
        run: python -m unittest discover -s tools -p "test_*.py"
      # unittest discovery does not recurse into the non-package tools/data directory.
      - name: Test data and evidence tools
        run: python -m unittest discover -s tools/data -p "test_*.py"
